name: Build Enchanted Frames

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate and package suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read suite version
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^## Version:[[:space:]]*(.+)$/\1/p' RevathsEnchantedFrames/RevathsEnchantedFrames.toc)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate manifests and Lua syntax
        shell: bash
        run: |
          for addon in RevathsEnchantedFrames RevathsMailbox RevathsMacro RevathsMailboxTooltipHelper; do
            test -f "$addon/$addon.toc"
          done
          npx --yes luaparse \
            RevathsEnchantedFrames/Core.lua RevathsEnchantedFrames/Settings.lua \
            RevathsMailbox/Core.lua RevathsMailbox/UI.lua \
            RevathsMacro/Core.lua RevathsMacro/UI.lua \
            RevathsMailboxTooltipHelper/Tooltips.lua >/dev/null

      - name: Package suite
        shell: bash
        run: |
          staging="$RUNNER_TEMP/revaths-enchanted-frames"
          zip_path="$RUNNER_TEMP/RevathsEnchantedFrames-v${{ steps.version.outputs.version }}-${{ github.run_number }}.zip"
          mkdir -p "$staging"
          cp -R RevathsEnchantedFrames RevathsMailbox RevathsMacro RevathsMailboxTooltipHelper "$staging/"
          (cd "$staging" && zip -r "$zip_path" RevathsEnchantedFrames RevathsMailbox RevathsMacro RevathsMailboxTooltipHelper)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevathsEnchantedFrames-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: ${{ runner.temp }}/RevathsEnchantedFrames-v${{ steps.version.outputs.version }}-${{ github.run_number }}.zip
          if-no-files-found: error
