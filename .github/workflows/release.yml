name: Build and release Enchanted Frames

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enchanted-frames-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read planned suite version
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^## Version:[[:space:]]*([0-9]+)\.([0-9]+)\.([0-9]+)[[:space:]]*$/\1.\2.\3/p' RevathsEnchantedFrames/RevathsEnchantedFrames.toc)
          if [ -z "$version" ]; then
            echo "Could not find a semantic version in the parent manifest." >&2
            exit 1
          fi
          release_tag="v$version"

          if git ls-remote --exit-code origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; choose a new manifest version for the next release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Validate synchronized manifest versions
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          expected="${{ steps.version.outputs.version }}"
          for toc in \
            RevathsEnchantedFrames/RevathsEnchantedFrames.toc \
            RevathsMailbox/RevathsMailbox.toc \
            RevathsMacro/RevathsMacro.toc \
            RevathsMailboxTooltipHelper/RevathsMailboxTooltipHelper.toc \
            RevathsWeeklyPlanner/RevathsWeeklyPlanner.toc; do
            actual=$(sed -nE 's/^## Version:[[:space:]]*(.+)$/\1/p' "$toc")
            if [ "$actual" != "$expected" ]; then
              echo "$toc has version '$actual'; expected '$expected'." >&2
              exit 1
            fi
          done

      - name: Validate Lua syntax
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          npx --yes luaparse \
            RevathsEnchantedFrames/Core.lua RevathsEnchantedFrames/Fonts.lua RevathsEnchantedFrames/Settings.lua \
            RevathsMailbox/Core.lua RevathsMailbox/UI.lua \
            RevathsMacro/Core.lua RevathsMacro/UI.lua \
            RevathsMailboxTooltipHelper/Tooltips.lua \
            RevathsWeeklyPlanner/Core.lua RevathsWeeklyPlanner/Characters.lua RevathsWeeklyPlanner/Catalog.lua RevathsWeeklyPlanner/Activities.lua RevathsWeeklyPlanner/Progress.lua RevathsWeeklyPlanner/Details.lua RevathsWeeklyPlanner/UI.lua >/dev/null

      - name: Validate weekly planner behavior
        if: steps.version.outputs.should_release == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          lua5.1 tests/weekly_planner.lua
          lua5.1 tests/weekly_progress.lua
          lua5.1 tests/weekly_activities.lua
          lua5.1 tests/macro_default_icon.lua
          lua5.1 tests/fonts.lua

      - name: Package suite
        if: steps.version.outputs.should_release == 'true'
        id: package
        shell: bash
        run: |
          staging="$RUNNER_TEMP/revaths-enchanted-frames-release"
          zip_name="RevathsEnchantedFrames-${{ steps.version.outputs.release_tag }}.zip"
          zip_path="$RUNNER_TEMP/$zip_name"
          mkdir -p "$staging"
          cp -R RevathsEnchantedFrames RevathsMailbox RevathsMacro RevathsMailboxTooltipHelper RevathsWeeklyPlanner "$staging/"
          (cd "$staging" && zip -r "$zip_path" RevathsEnchantedFrames RevathsMailbox RevathsMacro RevathsMailboxTooltipHelper RevathsWeeklyPlanner)
          expected="${{ steps.version.outputs.version }}"
          for addon in RevathsEnchantedFrames RevathsMailbox RevathsMacro RevathsMailboxTooltipHelper RevathsWeeklyPlanner; do
            actual=$(unzip -p "$zip_path" "$addon/$addon.toc" | sed -nE 's/^## Version:[[:space:]]*(.+)$/\1/p' | tr -d '\r')
            if [ "$actual" != "$expected" ]; then
              echo "Packaged $addon has version '$actual'; expected '$expected'." >&2
              exit 1
            fi
          done
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Tag validated release commit
        if: steps.version.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Upload workflow artifact
        if: steps.version.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: |
          gh release create "$RELEASE_TAG" "$ZIP_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Revath's Enchanted Frames $RELEASE_TAG" \
            --generate-notes
