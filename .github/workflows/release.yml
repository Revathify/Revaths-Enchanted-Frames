name: Build and release Enchanted Frames

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enchanted-frames-release
  cancel-in-progress: false

jobs:
  release:
    name: Bump version, package, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump suite patch version
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^## Version:[[:space:]]*([0-9]+)\.([0-9]+)\.([0-9]+)[[:space:]]*$/\1 \2 \3/p' RevathsEnchantedFrames/RevathsEnchantedFrames.toc)
          if [ -z "$version" ]; then
            echo "Could not find a semantic version in the parent manifest." >&2
            exit 1
          fi
          read -r major minor patch <<< "$version"
          next_version="$major.$minor.$((patch + 1))"
          release_tag="v$next_version"

          if git ls-remote --exit-code origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for toc in \
            RevathsEnchantedFrames/RevathsEnchantedFrames.toc \
            RevathsMailbox/RevathsMailbox.toc \
            RevathsMacro/RevathsMacro.toc \
            RevathsMailboxTooltipHelper/RevathsMailboxTooltipHelper.toc; do
            sed -i -E "s/^## Version:.*/## Version: $next_version/" "$toc"
          done

          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Validate synchronized manifest versions
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          expected="${{ steps.version.outputs.next_version }}"
          for toc in \
            RevathsEnchantedFrames/RevathsEnchantedFrames.toc \
            RevathsMailbox/RevathsMailbox.toc \
            RevathsMacro/RevathsMacro.toc \
            RevathsMailboxTooltipHelper/RevathsMailboxTooltipHelper.toc; do
            actual=$(sed -nE 's/^## Version:[[:space:]]*(.+)$/\1/p' "$toc")
            if [ "$actual" != "$expected" ]; then
              echo "$toc has version '$actual'; expected '$expected'." >&2
              exit 1
            fi
          done

      - name: Validate Lua syntax
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          npx --yes luaparse \
            RevathsEnchantedFrames/Core.lua RevathsEnchantedFrames/Settings.lua \
            RevathsMailbox/Core.lua RevathsMailbox/UI.lua \
            RevathsMacro/Core.lua RevathsMacro/UI.lua \
            RevathsMailboxTooltipHelper/Tooltips.lua >/dev/null

      - name: Package suite
        if: steps.version.outputs.should_release == 'true'
        id: package
        shell: bash
        run: |
          staging="$RUNNER_TEMP/revaths-enchanted-frames-release"
          zip_name="RevathsEnchantedFrames-${{ steps.version.outputs.release_tag }}.zip"
          zip_path="$RUNNER_TEMP/$zip_name"
          mkdir -p "$staging"
          cp -R RevathsEnchantedFrames RevathsMailbox RevathsMacro RevathsMailboxTooltipHelper "$staging/"
          (cd "$staging" && zip -r "$zip_path" RevathsEnchantedFrames RevathsMailbox RevathsMacro RevathsMailboxTooltipHelper)
          expected="${{ steps.version.outputs.next_version }}"
          for addon in RevathsEnchantedFrames RevathsMailbox RevathsMacro RevathsMailboxTooltipHelper; do
            actual=$(unzip -p "$zip_path" "$addon/$addon.toc" | sed -nE 's/^## Version:[[:space:]]*(.+)$/\1/p' | tr -d '\r')
            if [ "$actual" != "$expected" ]; then
              echo "Packaged $addon has version '$actual'; expected '$expected'." >&2
              exit 1
            fi
          done
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Commit synchronized version and create tag
        if: steps.version.outputs.should_release == 'true'
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RevathsEnchantedFrames/*.toc RevathsMailbox/*.toc RevathsMacro/*.toc RevathsMailboxTooltipHelper/*.toc
          git commit -m "Bump addon suite version to $NEXT_VERSION [skip ci]"
          git tag "$RELEASE_TAG"
          git push origin HEAD:main "$RELEASE_TAG"

      - name: Upload workflow artifact
        if: steps.version.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: |
          gh release create "$RELEASE_TAG" "$ZIP_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Revath's Enchanted Frames $RELEASE_TAG" \
            --generate-notes
